<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Dev Console · Primorely</title>
  <style>
    :root{--bg:#06101d;--panel:#0b192a;--line:#213953;--ink:#e8f2ff;--muted:#8fa7c2;--green:#4af2ad;--cyan:#4edaff;--amber:#ffbc58;--red:#ff667a;--blue:#398bff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#16355f 0,transparent 36%),var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}.shell{width:min(1560px,calc(100% - 28px));margin:14px auto 38px}.hud{display:flex;align-items:center;gap:16px;padding:16px 19px;border:1px solid var(--line);border-radius:14px;background:#091729cc;box-shadow:0 18px 70px #0007}.mark{width:42px;height:42px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan);box-shadow:0 0 20px #26d9ff55}.hud h1{font-size:17px;letter-spacing:.13em;margin:0}.hud p{margin:2px 0 0;color:var(--muted);font-size:12px}.hud-actions{margin-left:auto;display:flex;align-items:center;gap:11px}.live{color:var(--green);font-size:11px}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 12px var(--green)}button{border:1px solid #3574a8;border-radius:8px;background:#102c49;color:#eaf7ff;padding:9px 12px;font:700 12px inherit;cursor:pointer}button:hover{background:#174169}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:13px;margin-top:13px}.card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(140deg,#0c1b2d,#081524);overflow:hidden}.card>header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card h2{font-size:12px;letter-spacing:.1em;margin:0;color:#b9d6f4}.card small{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:13px}.metric{padding:12px;border:1px solid #1a354f;border-radius:9px;background:#081625}.metric span{display:block;font-size:11px;color:var(--muted)}.metric b{display:block;margin-top:6px;font-size:21px;color:var(--cyan)}.metric b.good{color:var(--green)}.metric b.warn{color:var(--amber)}.wide{grid-column:1/-1}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}.table-wrap{overflow:auto;max-height:500px}.data{width:100%;border-collapse:collapse;font-size:12px}.data th{text-align:left;color:#89b4da;background:#0c2035;position:sticky;top:0}.data th,.data td{padding:9px 11px;border-bottom:1px solid #173049;white-space:nowrap}.data td:nth-child(2){color:var(--muted)}.status{font-size:10px;font-weight:800;padding:3px 7px;border-radius:20px;background:#103926;color:var(--green)}.status.warn{background:#432f15;color:var(--amber)}.route-list,.feed{list-style:none;padding:0;margin:0}.route-list li,.feed li{padding:11px 14px;border-bottom:1px solid #173049}.route-list code{color:var(--cyan)}.route-list span{display:block;color:var(--muted);margin-top:3px}.feed time{color:var(--blue);font-size:10px;margin-right:8px}.security{padding:15px}.security p{margin:0 0 8px;color:#b3c6dd}.security b{color:var(--green)}details{margin:7px 10px;border:1px solid #193752;border-radius:7px}summary{padding:8px;cursor:pointer;color:#b4d8f7}pre{margin:0;padding:10px;overflow:auto;color:#aac9e8;font-size:11px;background:#06111e}@media(max-width:900px){.grid,.split{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.shell{width:min(100% - 16px,1560px)}.hud{align-items:flex-start}.hud-actions{margin-left:0;flex-wrap:wrap}.hud{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hud"><div class="mark">⌁</div><div><h1>PRIMORELY // FLIGHT DECK</h1><p>Console operacional de engenharia · modo somente leitura</p></div><div class="hud-actions"><span class="live"><i></i>TELEMETRIA ATIVA</span><button id="refresh">↻ ATUALIZAR</button><button id="back">← SISTEMA</button></div></header>
    <section class="grid" id="app" data-flight-deck="true"><div class="card wide"><header><h2>FLIGHT DECK 1.17.0</h2></header><div class="security">Carregador de contingência ativo…</div></div></section>
  </main>
  <script type="application/json" id="dev-console-legacy-loader">
  (function(){
    var app=document.getElementById('app'),token=localStorage.getItem('pnr-session-id')||'';
    var esc=function(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&gt;',"'":'&#39;','"':'&quot;'}[c];});};
    var request=function(){return fetch('./api/dev-console',{cache:'no-store',headers:token?{Authorization:'Bearer '+token}:{}}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.message||'HTTP '+r.status);return d;});});};
    var table=function(t){var cols=(t.colunas||[]).map(function(c){return c.nome+' '+c.tipo;}).join('\n');return '<tr><td><span class="status '+(t.status==='ONLINE'?'':'warn')+'">'+esc(t.status)+'</span></td><td>'+esc(t.nome)+'</td><td>'+esc(t.registros==null?'—':t.registros)+'</td><td>'+esc((t.indices||[]).length)+'</td><td><details><summary>COLUNAS '+(t.colunas||[]).length+'</summary><pre>'+esc(cols||t.mensagem||'Indisponível')+'</pre></details></td></tr>';};
    function render(d){var env=d.ambiente||{},tables=d.tabelas||[],acts=d.atividade||[],warnings=d.avisos||[];app.innerHTML='<section class="card wide"><header><h2>STATUS DO VOO</h2><small>'+esc(d.executadoEm)+'</small></header><div class="metrics"><div class="metric"><span>BANCO DE DADOS</span><b class="good">ONLINE</b><small>'+esc(env.banco)+'</small></div><div class="metric"><span>LATÊNCIA SQL</span><b class="'+(Number(env.latenciaMs)>150?'warn':'good')+'">'+esc(env.latenciaMs)+'ms</b><small>teste SELECT 1</small></div><div class="metric"><span>TABELAS VISÍVEIS</span><b>'+tables.length+'</b><small>somente metadados</small></div><div class="metric"><span>ALERTAS TÉCNICOS</span><b class="'+(warnings.length?'warn':'good')+'">'+warnings.length+'</b><small>'+esc(warnings.length?'revisar permissões':'sem alertas')</small></div></div></section><section class="card"><header><h2>MAPA DE DADOS</h2><small>estrutura e volume</small></header><div class="table-wrap"><table class="data"><thead><tr><th>ESTADO</th><th>TABELA</th><th>LINHAS</th><th>ÍNDICES</th><th>ESQUEMA</th></tr></thead><tbody>'+tables.map(table).join('')+'</tbody></table></div></section><section class="split"><article class="card"><header><h2>ATIVIDADE / FILAS</h2><small>contadores atuais</small></header><ul class="feed">'+acts.map(function(a){return '<li><time>●</time><strong>'+esc(a.fonte)+'</strong><span> '+esc(a.disponivel?a.total+' registros':'indisponível')+'</span></li>';}).join('')+'</ul></article><article class="card"><header><h2>ROTAS CRÍTICAS</h2><small>contratos de API</small></header><ul class="route-list">'+Object.keys(d.rotas||{}).map(function(k){return '<li><code>'+esc(d.rotas[k])+'</code><span>'+esc(k)+'</span></li>';}).join('')+'</ul></article><article class="card wide"><header><h2>SEGURANÇA E CONTEXTO</h2><small>operador: '+esc((d.operador||{}).nome)+' · '+esc((d.operador||{}).perfil)+'</small></header><div class="security"><p><b>PHP:</b> '+esc(env.php)+' · <b>SAPI:</b> '+esc(env.sapi)+' · <b>Fuso:</b> '+esc(env.timezone)+'</p><p><b>Proteção:</b> '+esc((d.seguranca||{}).dadosSensíveis)+' '+esc((d.seguranca||{}).acesso)+'</p><p><b>Operação:</b> '+esc((d.seguranca||{}).operacao)+'</p></div></article></section>';}
    function load(){app.innerHTML='<section class="card wide"><header><h2>TELEMETRIA</h2></header><div class="security">Sincronizando subsistemas…</div></section>';request().then(render).catch(function(e){app.innerHTML='<section class="card wide"><header><h2>ACESSO INTERROMPIDO</h2></header><div class="security"><p><b>Não foi possível abrir o Flight Deck.</b></p><p>'+esc(e.message)+'</p><p>Este painel requer uma sessão administrativa válida.</p></div></section>';});}
    document.getElementById('refresh').onclick=load;document.getElementById('back').onclick=function(){location.href='index.html';};load();
  })();
  </script>
  <script>
  (function(){
    var host=document.getElementById('app');if(!host)return;
    var token=localStorage.getItem('pnr-session-id')||'';
    var escapeHtml=function(value){var box=document.createElement('span');box.textContent=String(value==null?'':value);return box.innerHTML;};
    var showError=function(message){host.innerHTML='<section class="card wide"><header><h2>CONEXÃO NÃO CONCLUÍDA</h2></header><div class="security"><p><b>'+escapeHtml(message)+'</b></p><p>O painel alcançou a API, mas não recebeu os dados esperados. Verifique se a sessão é de administrador.</p></div></section>';};
    var controller=window.AbortController?new AbortController():null;
    var timer=setTimeout(function(){if(controller)controller.abort();showError('A consulta técnica excedeu 10 segundos.');},10000);
    fetch('./api/dev-console/index.php',{cache:'no-store',headers:token?{Authorization:'Bearer '+token}:{},signal:controller?controller.signal:undefined}).then(function(response){return response.text().then(function(text){var data;try{data=JSON.parse(text);}catch(error){throw new Error('A API devolveu uma resposta inválida.');}if(!response.ok)throw new Error(data.message||('HTTP '+response.status));return data;});}).then(function(data){clearTimeout(timer);var tables=data.tabelas||[],activity=data.atividade||[],processes=data.processos||[],environment=data.ambiente||{};host.innerHTML='<section class="card wide"><header><h2>STATUS DO VOO · DADOS AO VIVO</h2><small>'+escapeHtml(data.executadoEm)+'</small></header><div class="metrics"><div class="metric"><span>BANCO</span><b class="good">ONLINE</b><small>'+escapeHtml(environment.banco)+'</small></div><div class="metric"><span>LATÊNCIA</span><b>'+escapeHtml(environment.latenciaMs)+' ms</b><small>consulta SQL</small></div><div class="metric"><span>TABELAS</span><b>'+tables.length+'</b><small>catálogo conectado</small></div><div class="metric"><span>OPERADOR</span><b class="good">OK</b><small>'+escapeHtml((data.operador||{}).nome)+'</small></div></div></section><section class="card wide"><header><h2>14 PROCESSOS DE ANÁLISE</h2><small>operações, infraestrutura e telemetria</small></header><div class="table-wrap"><table class="data"><thead><tr><th>PROCESSO</th><th>ESTADO</th><th>VALOR</th><th>LATÊNCIA</th><th>DETALHE</th></tr></thead><tbody>'+processes.map(function(process){return '<tr><td>'+escapeHtml(process.titulo)+'</td><td><span class="status '+(process.status==='ONLINE'?'': 'warn')+'">'+escapeHtml(process.status)+'</span></td><td>'+escapeHtml(process.valor==null?'—':process.valor)+'</td><td>'+escapeHtml(process.latenciaMs==null?'—':process.latenciaMs+' ms')+'</td><td>'+escapeHtml(process.detalhe)+'</td></tr>';}).join('')+'</tbody></table></div></section><section class="card"><header><h2>TABELAS CONECTADAS</h2><small>metadados e volume estimado</small></header><div class="table-wrap"><table class="data"><thead><tr><th>TABELA</th><th>LINHAS</th><th>COLUNAS</th><th>ÍNDICES</th></tr></thead><tbody>'+tables.map(function(table){return '<tr><td>'+escapeHtml(table.nome)+'</td><td>'+escapeHtml(table.registros==null?'—':table.registros)+'</td><td>'+escapeHtml((table.colunas||[]).length)+'</td><td>'+escapeHtml((table.indices||[]).length)+'</td></tr>';}).join('')+'</tbody></table></div></section><section class="card"><header><h2>ATIVIDADE OPERACIONAL</h2></header><ul class="feed">'+activity.map(function(item){return '<li><strong>'+escapeHtml(item.fonte)+'</strong><span> '+escapeHtml(item.disponivel?item.total+' registros':'indisponível')+'</span></li>';}).join('')+'</ul></section>';}).catch(function(error){clearTimeout(timer);showError(error&&error.name==='AbortError'?'A consulta técnica excedeu 10 segundos.':(error&&error.message||'Falha desconhecida ao consultar a API.'));});
  })();
  </script>
</body></html>
