<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar | Primorely</title>
  <style>
    :root{--navy:#10162d;--navy-deep:#09142d;--purple:#6c4cff;--cyan:#00c7e8;--line:rgba(255,255,255,.14);--text:#f7f9ff;--muted:rgba(235,242,255,.64);--danger:#ffb4b4;--ok:#9af0c7}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:22px;background:radial-gradient(ellipse 90% 58% at 50% -14%,rgba(0,199,232,.28),transparent 64%),radial-gradient(ellipse 80% 60% at 50% 110%,rgba(108,76,255,.42),transparent 68%),linear-gradient(160deg,#0b1937 0%,#132957 50%,#0b1632 100%);color:var(--text);font-family:Inter,Manrope,Poppins,"Segoe UI",Arial,sans-serif}.glow{position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none}.glow.one{width:380px;height:380px;top:-220px;left:15%;background:rgba(0,199,232,.2);animation:float 8s ease-in-out infinite}.glow.two{width:440px;height:440px;right:5%;bottom:-280px;background:rgba(108,76,255,.28);animation:float 9s ease-in-out infinite reverse}.login-scene{position:relative;z-index:1;width:min(100%,405px);perspective:1200px;animation:arrive .65s cubic-bezier(.2,.8,.2,1) both}.login-card{position:relative;overflow:hidden;padding:34px 30px 28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(8,23,52,.82),rgba(16,24,55,.68));box-shadow:0 30px 80px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(135%);transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s ease}.login-card:before{content:"";position:absolute;inset:0;opacity:.34;background-image:linear-gradient(135deg,rgba(255,255,255,.24) .5px,transparent .5px),linear-gradient(45deg,rgba(255,255,255,.16) .5px,transparent .5px);background-size:30px 30px;mask-image:linear-gradient(to bottom,black,transparent 72%);pointer-events:none}.login-card:after{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(110deg,transparent 10%,rgba(0,199,232,.72),transparent 34%,transparent 62%,rgba(108,76,255,.72),transparent 88%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:borderFlow 5s linear infinite}.brand{position:relative;z-index:1;display:grid;place-items:center;margin:0 0 31px}.brand img{display:block;width:min(245px,78%);height:auto;filter:drop-shadow(0 12px 24px rgba(0,0,0,.3))}.login-form{position:relative;z-index:1;display:grid;gap:16px}.field{display:grid;gap:8px}.field label{font-size:12px;font-weight:760;color:rgba(255,255,255,.82);letter-spacing:.02em}.input-wrap{position:relative;display:flex;align-items:center}.input-wrap svg{position:absolute;left:14px;width:18px;height:18px;color:rgba(255,255,255,.5);pointer-events:none;transition:color .2s ease}.input-wrap input{width:100%;height:47px;padding:0 43px;border:1px solid rgba(255,255,255,.12);border-radius:12px;outline:0;background:rgba(255,255,255,.07);color:#fff;font:inherit;transition:background .2s ease,border-color .2s ease,box-shadow .2s ease}.input-wrap input::placeholder{color:rgba(255,255,255,.38)}.input-wrap:focus-within svg{color:var(--cyan)}.input-wrap input:focus{border-color:rgba(0,199,232,.7);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(0,199,232,.12)}.password-toggle{position:absolute;right:10px;width:31px;height:31px;padding:0;border:0;border-radius:9px;background:transparent;color:rgba(255,255,255,.54);cursor:pointer;display:grid;place-items:center}.password-toggle:hover,.password-toggle:focus-visible{color:#fff;background:rgba(255,255,255,.1);outline:0}.password-toggle svg{position:static}.options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:1px}.remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;cursor:pointer}.remember input{position:absolute;opacity:0}.remember i{width:16px;height:16px;border:1px solid rgba(255,255,255,.3);border-radius:5px;background:rgba(255,255,255,.05);display:grid;place-items:center;transition:background .2s ease,border-color .2s ease}.remember input:checked+i{border-color:#fff;background:#fff}.remember input:checked+i:after{content:"✓";color:#111a35;font-size:12px;font-weight:900}.remember input:focus-visible+i{box-shadow:0 0 0 3px rgba(0,199,232,.22)}.submit{height:48px;margin-top:7px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#fff,#eaf8ff);color:#101828;font:800 14px inherit;letter-spacing:.01em;box-shadow:0 14px 28px rgba(0,0,0,.2);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}.submit:hover{transform:translateY(-2px);filter:brightness(1.03);box-shadow:0 19px 34px rgba(0,0,0,.3)}.submit:focus-visible{outline:0;box-shadow:0 0 0 4px rgba(0,199,232,.23),0 19px 34px rgba(0,0,0,.3)}.submit:disabled{opacity:.72;cursor:wait;transform:none}.message{min-height:19px;margin:2px 0 0;color:var(--muted);font-size:12px;line-height:1.45;text-align:center}.message.error{color:var(--danger)}.message.ok{color:var(--ok)}@keyframes arrive{from{opacity:0;transform:translateY(18px) scale(.975)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translate3d(0,18px,0) scale(1.08)}}@keyframes borderFlow{to{filter:hue-rotate(26deg)}}@media(max-width:460px){body{padding:14px}.login-card{padding:29px 22px 23px;border-radius:21px}.brand{margin-bottom:27px}.options{justify-content:flex-start}.brand img{width:220px}}
    .login-card{will-change:transform}.card-effects{position:absolute;inset:-1px;z-index:3;overflow:hidden;border-radius:24px;pointer-events:none}.card-beam{position:absolute;display:block;opacity:.75;filter:blur(1.4px);background:linear-gradient(90deg,transparent,rgba(255,255,255,.98),transparent);box-shadow:0 0 11px rgba(0,199,232,.58)}.card-beam.top,.card-beam.bottom{width:42%;height:2px}.card-beam.left,.card-beam.right{width:2px;height:42%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.98),transparent)}.card-beam.top{top:0;left:-46%;animation:beamTop 3.8s ease-in-out infinite}.card-beam.right{right:0;top:-46%;animation:beamRight 3.8s ease-in-out .95s infinite}.card-beam.bottom{right:-46%;bottom:0;animation:beamBottom 3.8s ease-in-out 1.9s infinite}.card-beam.left{left:0;bottom:-46%;animation:beamLeft 3.8s ease-in-out 2.85s infinite}.login-card:hover{box-shadow:0 38px 95px rgba(0,0,0,.48),0 0 38px rgba(0,199,232,.12),inset 0 1px 0 rgba(255,255,255,.1)}@keyframes beamTop{0%,15%{left:-46%;opacity:0}38%,62%{opacity:.9}85%,100%{left:104%;opacity:0}}@keyframes beamRight{0%,15%{top:-46%;opacity:0}38%,62%{opacity:.9}85%,100%{top:104%;opacity:0}}@keyframes beamBottom{0%,15%{right:-46%;opacity:0}38%,62%{opacity:.9}85%,100%{right:104%;opacity:0}}@keyframes beamLeft{0%,15%{bottom:-46%;opacity:0}38%,62%{opacity:.9}85%,100%{bottom:104%;opacity:0}}.atmosphere{position:fixed;inset:-18%;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(115deg,rgba(0,235,255,.18),transparent 32%,rgba(123,78,255,.24) 70%,transparent)}.atmosphere:before{content:"";position:absolute;inset:0;opacity:.38;background-image:linear-gradient(rgba(160,238,255,.19) 1px,transparent 1px),linear-gradient(90deg,rgba(160,238,255,.19) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse at center,black,transparent 69%);transform:perspective(700px) rotateX(63deg) scale(1.6) translateY(22%);transform-origin:center bottom}.aurora{position:absolute;width:82vw;height:58vh;border-radius:50%;filter:blur(74px);opacity:.68;mix-blend-mode:screen}.aurora.a{top:-16vh;left:-14vw;background:linear-gradient(105deg,transparent 9%,#00f0ff 39%,#08b8ff 53%,#7b4dff 76%,transparent 98%);animation:auroraOne 9s ease-in-out infinite alternate}.aurora.b{right:-25vw;bottom:-22vh;background:linear-gradient(105deg,transparent 8%,#773cff 34%,#a24dff 51%,#00d9ff 77%,transparent 95%);animation:auroraTwo 11s ease-in-out infinite alternate}.aurora.c{width:54vw;height:38vh;top:37%;left:23%;background:radial-gradient(ellipse,#a887ff 0%,#5f4dff 24%,rgba(0,231,255,.88) 45%,transparent 72%);opacity:.34;animation:auroraThree 7s ease-in-out infinite alternate}.orbit{position:absolute;border:1px solid rgba(168,245,255,.25);border-radius:50%;opacity:.75}.orbit.one{width:720px;height:720px;top:-380px;right:-160px;animation:orbit 14s linear infinite}.orbit.two{width:980px;height:980px;bottom:-670px;left:-380px;border-color:rgba(178,128,255,.3);animation:orbit 19s linear infinite reverse}@keyframes auroraOne{from{transform:translate3d(-8%,-7%,0) rotate(-12deg) scale(.84)}to{transform:translate3d(20%,14%,0) rotate(16deg) scale(1.23)}}@keyframes auroraTwo{from{transform:translate3d(12%,8%,0) rotate(18deg) scale(.88)}to{transform:translate3d(-20%,-14%,0) rotate(-13deg) scale(1.26)}}@keyframes auroraThree{from{transform:translate(-19%,-13%) scale(.76)}to{transform:translate(22%,16%) scale(1.35)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.login-scene,.glow,.login-card:after,.card-beam,.aurora,.orbit{animation:none!important}.login-card{transition:none!important}}
    /* Movimento unificado e lento: uma volta completa de luz a cada 20 segundos. */
    .login-card:after{animation-duration:20s}
    .card-beam.top{animation:beamTop 20s ease-in-out infinite}
    .card-beam.right{animation:beamRight 20s ease-in-out 5s infinite}
    .card-beam.bottom{animation:beamBottom 20s ease-in-out 10s infinite}
    .card-beam.left{animation:beamLeft 20s ease-in-out 15s infinite}
    .glow.one{animation-duration:20s}.glow.two{animation-duration:20s}
    .aurora.a,.aurora.b,.aurora.c{animation-duration:20s}
    .orbit.one,.orbit.two{animation-duration:20s}
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"><span class="aurora a"></span><span class="aurora b"></span><span class="aurora c"></span><span class="orbit one"></span><span class="orbit two"></span></div><span class="glow one" aria-hidden="true"></span><span class="glow two" aria-hidden="true"></span>
  <main class="login-scene">
    <section class="login-card" id="login-card" aria-label="Acesso Primorely"><div class="card-effects" aria-hidden="true"><i class="card-beam top"></i><i class="card-beam right"></i><i class="card-beam bottom"></i><i class="card-beam left"></i></div>
      <header class="brand"><img src="./img/PrimorelyLogoBranco.png" alt="Primorely"></header>
      <form class="login-form" id="login-form">
        <div class="field"><label for="login"></label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m3 7 9 6 9-6"></path></svg><input id="login" name="login" autocomplete="username" placeholder="Digite seu usuário" required autofocus></div></div>
        <div class="field"><label for="senha"></label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg><input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required><button class="password-toggle" id="toggle-password" type="button" aria-label="Mostrar senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button></div></div>
        <div class="options"><label class="remember"><input id="remember" type="checkbox"><i aria-hidden="true"></i><span>Manter conectado</span></label></div>
        <button class="submit" id="submit" type="submit">Entrar</button><p class="message" id="message" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="./assets/login-auth-transport.js?v=20260908-login-fetch-v1"></script>
  <script>
    (function(){'use strict';var card=document.getElementById('login-card'),form=document.getElementById('login-form'),button=document.getElementById('submit'),message=document.getElementById('message'),password=document.getElementById('senha'),toggle=document.getElementById('toggle-password'),inApiDirectory=/(^|\/)api\//i.test(window.location.pathname),authUrl=inApiDirectory?'./login-alternativo.php':'./api/login-alternativo.php';if(card&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){card.addEventListener('pointermove',function(event){if(event.pointerType==='touch')return;var bounds=card.getBoundingClientRect(),x=(event.clientX-bounds.left)/bounds.width-.5,y=(event.clientY-bounds.top)/bounds.height-.5;card.style.transform='rotateX('+(-y*9)+'deg) rotateY('+(x*11)+'deg) translateY(-3px)';});card.addEventListener('pointerleave',function(){card.style.transform='rotateX(0) rotateY(0) translateY(0)';});}function showMessage(text,kind){message.textContent=text||'';message.className='message '+(kind||'');}function saveSession(payload){var user=payload.usuario||{},access=payload.acesso||{};localStorage.setItem('pnr-session-id',payload.sessionId||'');localStorage.setItem('pnr-user-id',user.id||'');localStorage.setItem('pnr-user-login',user.login||'');localStorage.setItem('pnr-user-name',user.nome||user.login||'');localStorage.setItem('usuarioNome',user.nome||user.login||'');localStorage.setItem('pnr-active-profile',user.perfilNome||'');localStorage.setItem('pnr-access-admin',String(!!access.admin));localStorage.setItem('pnr-access-modules',JSON.stringify(access.modulos||{}));localStorage.setItem('pnr-onboarding-status',user.onboardingStatus||(payload.requiresOnboarding?'Pendente':'Completo'));localStorage.setItem('pnr-last-activity',String(Date.now()));}function destination(){var next=new URLSearchParams(window.location.search).get('next')||'dashboard.html';if(!/^[a-z0-9_-]+\.html(?:\?[-a-z0-9_=&.%]+)?$/i.test(next))next='dashboard.html';return inApiDirectory?'../'+next:'./'+next;}toggle.onclick=function(){var visible=password.type==='text';password.type=visible?'password':'text';toggle.setAttribute('aria-label',visible?'Mostrar senha':'Ocultar senha');};form.addEventListener('submit',function(event){event.preventDefault();var login=String(form.elements.login.value||'').trim(),senha=String(form.elements.senha.value||'');if(!login||!senha){showMessage('Informe usuário e senha.','error');return;}button.disabled=true;showMessage('Validando acesso...');fetch(authUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({login:login,senha:senha})}).then(function(response){return response.json().catch(function(){return{};}).then(function(payload){if(!response.ok)throw new Error(payload.message||payload.code||('Erro HTTP '+response.status));if(!payload.sessionId)throw new Error('O servidor não retornou uma sessão válida.');return payload;});}).then(function(payload){saveSession(payload);showMessage('Acesso validado. Redirecionando...','ok');window.location.assign(destination());}).catch(function(error){showMessage(error.message||'Não foi possível autenticar agora.','error');button.disabled=false;});});}());
  </script>
</body>
</html>
